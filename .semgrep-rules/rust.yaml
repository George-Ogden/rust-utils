rules:
  - id: vec-from-iter
    languages:
      - rust
    severity: ERROR
    message: Use `Vec::from_iter()` to convert an iterator into a vector.
    pattern: $X.into_iter().collect_vec()
    fix: Vec::from_iter($X)

  - id: collection-from-iter
    languages:
      - rust
    severity: ERROR
    message: Use `FromIter::from_iter()` to convert an iterator into a collection.
    pattern: $X.into_iter().collect()

  - id: map-into
    languages:
      - rust
    severity: ERROR
    message: Use `MapInto::map_into` to convert an iterator to a new type.
    pattern: $X.map($T::from)
    fix: $X.map_into::<$T>()

  - id: should-panic-no-test
    languages:
      - rust
    severity: ERROR
    message: Missing `#[test]` on a function marked `#[should_panic]`.
    patterns:
      - pattern: |
          #[should_panic]
          fn $X() {
            ...
          }
      - pattern-not: |
          #[test]
          #[should_panic]
          fn $X() {
            ...
          }
    fix-regex:
      regex: |
        #\[should_panic\]
      replacement: |
        #[test]
        #[should_panic]

  - id: manual-deref-impl
    languages:
      - rust
    severity: ERROR
    message: Manual `Deref` implementation. Use `#[derive(Deref)]` and `#[deref]` on the struct definition.
    patterns:
      - pattern-inside: |
          impl Deref for $T {
            ...
          }
      - pattern: |
          fn deref(&self) -> &$U {
            return &self.$X
          }

  - id: manual-from-impl
    languages:
      - rust
    severity: ERROR
    message: Manual `From` implementation. Use `#[derive(Into)]` and `#[into]` on the struct definition.
    patterns:
      - pattern-inside: |
          impl From<$A> for $B {
            ...
          }
      - pattern: |
          fn from($X: $T) -> $U {
            return $X.$Y
          }

  - id: missing-test-decorator
    languages:
      - rust
    severity: ERROR
    message: "Missing `#[test]` on a test function."
    patterns:
      - pattern: |
          fn $NAME(...) {
            ...
          }
      - metavariable-regex:
          metavariable: $NAME
          regex: ^test_.*$
      - pattern-not: |
          #[test]
          fn $NAME(...) {
            ...
          }
      - pattern-not: |
          #[test_case(...)]
          fn $NAME(...) {
            ...
          }
      - pattern-not-inside: |
          impl $ANY {
            ...
          }

  - id: map-all-unique
    languages:
      - rust
    severity: ERROR
    message: Use of `Iterator::map` then `Itertools::all_unique` to check uniqueness by a key.
    pattern: |
      $X.map($F).all_unique()
    fix: $X.all_unique_by_key($F)

  - id: empty-vec-ref
    languages:
      - rust
    severity: ERROR
    message: Use reference of empty array instead of vector to avoid immediate dereference.
    pattern-either:
      - pattern: "&Vec::new()"
      - pattern: "&Vec::<$T>::new()"
      - pattern: "&vec![]"
    fix: "&[]"

  - id: manual-random-ratio
    languages:
      - rust
    severity: ERROR
    message: Use `StdRng::random_ratio` to get whole number ratios.
    pattern: $R.random_bool($X / $Y)
    fix: $R.random_ratio($X, $Y)

  - id: strip-float-suffix
    languages:
      - rust
    severity: ERROR
    message: Convert floats to integers (usually left over from `manual-random-ratio` fix).
    patterns:
      - pattern: $R.random_ratio($X, $Y)
      - metavariable-regex:
          metavariable: $X
          regex: (\d+)\.0(_?(f32|f64))?
      - metavariable-regex:
          metavariable: $Y
          regex: (\d+)\.0(_?(f32|f64))?
    fix-regex:
      regex: (\d+)\.0(_?(f32|f64))?
      replacement: \1
